; Production exports must use tools/export_game.ps1, which removes debug autoloads
; from an isolated staging configuration before applying this preset.
[preset.0]

name="Windows Production"
platform="Windows Desktop"
runnable=true
advanced_options=true
dedicated_server=false
custom_features="prototype"
export_filter="all_resources"
include_filter="config/*.json"
exclude_filter="addons/godot_ai/*,addons/gdUnit4/*,tests/*,reports/*"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/company_name=""
application/product_name="Another World Prototype"
application/file_description="Another World offline single-player prototype"
application/copyright="Project-original game content"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false
